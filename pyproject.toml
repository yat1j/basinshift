[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basinshift"
version = "1.0.0"
description = "Hydrology-Informed River-Discharge Forecasting & Generalization Across Unseen Catchments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "BASINSHIFT Research Initiative" }
]
keywords = [
    "hydrology",
    "flood-forecasting",
    "river-discharge",
    "machine-learning",
    "ungauged-basins",
    "physics-informed-ml"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
"fastapi",
"pandas==2.2.3",
"joblib",
"numpy",
"scikit-learn==1.7.2",
"xgboost",
"lightgbm",
"python-multipart",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0"
]
test = [
    "pytest>=8.0.0"
]
dev = [
    "pytest>=8.0.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["basinshift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
